<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realistic Balanced Sharp Frost Cracks</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 2160px;
            height: 1280px;
            /* 預設初始背景 */
            background: radial-gradient(circle at center, #060e18 0%, #010306 100%);
            animation: temperatureDrop 12s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            transition: background 3s ease; /* 讓背景階段切換更平滑 */
        }

        @keyframes temperatureDrop {
            0% {
                background: radial-gradient(circle at center, #0a1118 0%, #020408 100%);
            }
            100% {
                background: radial-gradient(circle at center, #0e2942 0%, #030a14 100%);
            }
        }

        /* 螢幕基礎結冰與冰霜邊框層 */
        .screen-frost-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            box-shadow: inset 0 0 180px rgba(0, 200, 255, 0.4),
                        inset 0 0 350px rgba(50, 180, 255, 0.2),
                        inset 0 0 60px rgba(255, 255, 255, 0.4);
            opacity: 0.6;
            animation: frostIntensify 15s forwards;
            transition: opacity 3s ease, box-shadow 3s ease;
        }

        @keyframes frostIntensify {
            to {
                opacity: 1;
                box-shadow: inset 0 0 220px rgba(0, 210, 255, 0.8),
                            inset 0 0 400px rgba(50, 190, 255, 0.5),
                            inset 0 0 80px rgba(255, 255, 255, 0.85);
            }
        }

        /* 動態銳利冰裂容器 */
        #crack-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 12;
            pointer-events: none;
            overflow: hidden;
        }

        /* 銳利冰裂彈出動畫 */
        .ice-sharp-crack {
            position: absolute;
            pointer-events: none;
            animation: sharpSnap 0.25s cubic-bezier(0, .8, .2, 1) forwards;
            filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.98)) 
                    drop-shadow(0 0 20px rgba(0, 210, 255, 0.8));
        }

        @keyframes sharpSnap {
            0% {
                transform: scale(0.3);
                opacity: 0;
                filter: brightness(2.5) drop-shadow(0 0 25px #fff);
            }
            30% {
                opacity: 1;
            }
            100% {
                transform: scale(1);
                opacity: 0.92;
            }
        }

        /* 暴風雪大雪花畫布層 */
        #snowflake-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* 主容器：極度冰凍面板 */
        .dashboard {
            position: relative;
            z-index: 5;
            width: 2040px;
            height: 1160px;
            background: linear-gradient(135deg, rgba(12, 35, 60, 0.8) 0%, rgba(2, 8, 18, 0.95) 100%);
            border: 4px solid rgba(175, 230, 255, 0.7);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 40px;
            display: grid;
            grid-template-columns: 520px 1fr 480px;
            align-items: center;
            padding: 50px 60px;
            box-shadow: 0 30px 120px rgba(0, 0, 0, 0.95), 
                        inset 0 0 70px rgba(135, 206, 250, 0.5),
                        inset 0 0 20px rgba(255, 255, 255, 0.7),
                        0 0 90px rgba(0, 180, 255, 0.35);
            transition: background 3s ease, border-color 3s ease;
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .card {
            background: rgba(8, 22, 40, 0.92);
            border: 2px solid rgba(135, 206, 250, 0.5);
            border-radius: 20px;
            padding: 35px 25px 25px 25px;
            position: relative;
            box-shadow: inset 0 0 30px rgba(135, 206, 250, 0.25);
            transition: background 3s ease, border-color 3s ease;
        }

        .card::before {
            content: '';
            position: absolute;
            top: -6px;
            left: 12px;
            right: 12px;
            height: 12px;
            background: #ffffff;
            border-radius: 8px 8px 3px 3px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.95), 0 0 30px rgba(135, 206, 250, 0.9);
            z-index: 10;
        }

        .card-accent-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 5px;
            height: 100%;
            background: #00f3ff;
            box-shadow: 0 0 20px #00f3ff;
            border-top-left-radius: 20px;
            border-bottom-left-radius: 20px;
        }

        .card-title {
            font-size: 30px;
            letter-spacing: 2px;
            color: #bde0fe;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .card-value {
            font-size: 100px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #ffffff;
            text-shadow: 0 0 30px rgba(135, 206, 250, 0.8);
        }

        .card-sub {
            font-size: 40px;
            color: #70d6ff;
            margin-top: 6px;
            letter-spacing: 1px;
            text-shadow: 0 0 15px rgba(112, 214, 255, 0.6);
        }

        .clock-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .countdown-banner {
            position: absolute;
            top: -75px;
            background: rgba(8, 22, 40, 0.95);
            border: 2px solid rgba(135, 206, 250, 0.65);
            padding: 12px 35px;
            border-radius: 50px;
            font-size: 35px;
            letter-spacing: 3px;
            color: #70d6ff;
            box-shadow: 0 0 40px rgba(112, 214, 255, 0.45);
            z-index: 10;
            transition: background 3s ease;
        }

        .countdown-banner span {
            color: #ff3366;
            font-weight: 700;
            font-size: 50px;
            margin: 0 6px;
            text-shadow: 0 0 20px #ff3366;
        }

        .clock-face {
            width: 760px;
            height: 760px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(4, 14, 28, 0.96) 0%, rgba(1, 4, 10, 0.99) 100%);
            border: 5px solid rgba(135, 206, 250, 0.85);
            box-shadow: 0 0 110px rgba(0, 243, 255, 0.45), 
                        inset 0 0 90px rgba(0, 0, 0, 0.95),
                        0 0 35px rgba(255, 255, 255, 0.5);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 3s ease, border-color 3s ease;
        }

        .clock-face::after {
            content: '';
            position: absolute;
            width: 710px;
            height: 710px;
            border-radius: 50%;
            border: 2px dashed rgba(135, 206, 250, 0.5);
            animation: rotateBg 120s linear infinite;
        }

        @keyframes rotateBg {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .center-dot {
            width: 22px;
            height: 22px;
            background: #00f3ff;
            border-radius: 50%;
            position: absolute;
            z-index: 10;
            box-shadow: 0 0 30px #00f3ff, 0 0 60px #00f3ff;
        }

        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom;
            border-radius: 10px;
            z-index: 5;
        }

        .hour-hand {
            width: 10px;
            height: 190px;
            background: linear-gradient(to top, #ffffff, #a2d2ff);
            transform: translateX(-50%) rotate(0deg);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.7);
        }

        .minute-hand {
            width: 7px;
            height: 275px;
            background: linear-gradient(to top, #00f3ff, #0066ff);
            transform: translateX(-50%) rotate(0deg);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.9);
        }

        .second-hand {
            width: 3px;
            height: 310px;
            background: #ff3366;
            transform: translateX(-50%) rotate(0deg);
            z-index: 6;
            box-shadow: 0 0 20px #ff3366;
        }
        
        .second-hand::after {
            content: '';
            position: absolute;
            bottom: -35px;
            left: -3px;
            width: 9px;
            height: 45px;
            background: #ff3366;
            border-radius: 4px;
        }

        .digital-time {
            margin-top: 35px;
            font-size: 84px;
            font-weight: 300;
            letter-spacing: 8px;
            color: #ffffff;
            text-shadow: 0 0 45px rgba(0, 243, 255, 0.7);
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body>

    <div class="screen-frost-overlay" id="frost-overlay"></div>
    <div id="crack-container"></div>
    <canvas id="snowflake-canvas"></canvas>

    <div class="dashboard" id="main-dashboard">
        <!-- 左側面板 -->
        <div class="side-panel">
            <div class="card" id="card-left-1">
                <div class="card-accent-line" style="background: #00f3ff;"></div>
                <div class="card-title">Current Date</div>
                <div class="card-value" id="date-display">----.--.--</div>
                <div class="card-sub" id="weekday-display">載入中...</div>
            </div>
            <div class="card" id="card-left-2">
                <div class="card-accent-line" style="background: #9d4edd;"></div>
                <div class="card-title">Status Effect</div>
                <div class="card-value" style="font-size: 36px; color: #70d6ff;">FROZEN ❄️</div>                            
                <div class="card-sub" style="color: #c77dff;">SPEED REDUCED 50%</div>
            </div>
        </div>

        <!-- 中央時鐘 -->
        <div class="clock-container" id="clock-box">
            <div class="countdown-banner" id="countdown-banner">
                ❄️ 平安夜 倒數 <span id="countdown-days">05</span> 天 ❄️
            </div>

            <br></br>

            <div class="clock-face" id="clock-face">
                <div class="center-dot"></div>
                <div class="hand hour-hand" id="hour-hand"></div>
                <div class="hand minute-hand" id="minute-hand"></div>
                <div class="hand second-hand" id="second-hand"></div>
            </div>
            <div class="digital-time" id="digital-time">00:00:00</div>
        </div>

        <!-- 右側面板 -->
        <div class="side-panel">
            <div class="card" id="card-right-1">
                <div class="card-accent-line" style="background: #00ff66;"></div>
                <div class="card-title" id="location-title">Weather (Miaoli)</div>
                <div class="card-value" id="weather-temp">--°C</div>
                <div class="card-sub" id="weather-desc">冰晶氣象資料讀取中...</div>
            </div>
            <div class="card" id="card-right-2">
                <div class="card-accent-line" style="background: #ffaa00;"></div>
                <div class="card-title">Environment</div>
                <div class="card-sub" id="weather-humidity">濕度 --%</div>           
                <div class="card-sub" style="color: #ffaa00;" id="weather-aqi">空氣品質：極凍同步</div>
            </div>
        </div>
    </div>

    <script>
        const startTime = Date.now();
        const crackDelay = 36 * 1000; // 前 36 秒正常，36 秒後開始裂開
        const existingCrystals = [];

        // 四方位輪流計數器
        let directionIndex = 0;
        const directions = ['top', 'bottom', 'left', 'right'];

        function spawnSharpCrack() {
            if (Date.now() - startTime < crackDelay) {
                scheduleNextCrack();
                return;
            }

            const container = document.getElementById('crack-container');
            const w = window.innerWidth;
            const h = window.innerHeight;

            const clockRect = document.getElementById('clock-box').getBoundingClientRect();
            const leftCards = document.querySelectorAll('.side-panel')[0].getBoundingClientRect();
            const rightCards = document.querySelectorAll('.side-panel')[1].getBoundingClientRect();

            let posX, posY;
            let attempts = 0;
            let isValid = false;

            const chosenDir = directions[directionIndex];
            directionIndex = (directionIndex + 1) % directions.length;

            do {
                // 強制將起點定在螢幕的最邊邊
                if (chosenDir === 'top') {
                    posX = Math.random() * w;
                    posY = 0;
                } else if (chosenDir === 'bottom') {
                    posX = Math.random() * w;
                    posY = h;
                } else if (chosenDir === 'left') {
                    posX = 0;
                    posY = Math.random() * h;
                } else {
                    posX = w;
                    posY = Math.random() * h;
                }

                // 避開中央時鐘與左右卡片區
                const inClock = (posX >= clockRect.left - 40 && posX <= clockRect.right + 40 && posY >= clockRect.top - 40 && posY <= clockRect.bottom + 40);
                const inLeftCard = (posX >= leftCards.left - 30 && posX <= leftCards.right + 30 && posY >= leftCards.top - 30 && posY <= leftCards.bottom + 30);
                const inRightCard = (posX >= rightCards.left - 30 && posX <= rightCards.right + 30 && posY >= rightCards.top - 30 && posY <= rightCards.bottom + 30);

                let isTooClose = false;
                for (let c of existingCrystals) {
                    const dist = Math.sqrt(Math.pow(posX - c.x, 2) + Math.pow(posY - c.y, 2));
                    if (dist < 200) {
                        isTooClose = true;
                        break;
                    }
                }

                if (!inClock && !inLeftCard && !inRightCard && !isTooClose) {
                    isValid = true;
                }
                attempts++;
            } while (!isValid && attempts < 50);

            if (!isValid) {
                scheduleNextCrack();
                return;
            }

            existingCrystals.push({ x: posX, y: posY });
            if (existingCrystals.length > 20) {
                existingCrystals.shift();
            }

            const crackElem = document.createElement('div');
            crackElem.className = 'ice-sharp-crack';

            // 尺寸範圍 300px ~ 600px 之間
            const size = Math.floor(Math.random() * 300) + 300; 
            crackElem.style.left = (posX - size / 2) + 'px';
            crackElem.style.top = (posY - size / 2) + 'px';

            const rotation = Math.random() * 360;

            // 👑 微調轉折：減少轉角次數，呈現乾淨俐落、自然的冰晶裂紋
            const svgContent = `
                <svg width="${size}" height="${size}" viewBox="0 0 200 200" style="transform: rotate(${rotation}deg);">
                    <!-- 主裂痕折線：適度減少轉角，避免過度繁複 -->
                    <polyline points="100,100 110,60 120,20 135,0" stroke="rgba(255, 255, 255, 0.98)" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="miter"/>
                    
                    <!-- 側邊大分岔 1 -->
                    <polyline points="100,100 65,75 40,60" stroke="rgba(255, 255, 255, 0.95)" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="miter"/>
                    
                    <!-- 側邊大分岔 2 -->
                    <polyline points="100,100 135,115 165,110" stroke="rgba(255, 255, 255, 0.95)" stroke-width="2.0" fill="none" stroke-linecap="round" stroke-linejoin="miter"/>

                    <!-- 下方小副裂紋 -->
                    <polyline points="100,100 90,145 75,170" stroke="rgba(200, 240, 255, 0.9)" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="miter"/>
                </svg>
            `;

            crackElem.innerHTML = svgContent;
            container.appendChild(crackElem);

            if (container.children.length > 20) {
                container.removeChild(container.firstChild);
            }

            scheduleNextCrack();
        }

        // 每 3 ~ 6 秒隨機裂開一次的計時器
        function scheduleNextCrack() {
            const randomInterval = Math.floor(Math.random() * 3000) + 3000; // 3000ms ~ 6000ms (3~6秒)
            setTimeout(spawnSharpCrack, randomInterval);
        }

        // 初始化第一次排程
        scheduleNextCrack();

        // 👑 檢查時間進度以動態切換更白的背景與介面
        function checkExtremeFreezing() {
            const elapsed = Date.now() - startTime;
            const body = document.body;
            const dashboard = document.getElementById('main-dashboard');
            const frostOverlay = document.getElementById('frost-overlay');
            const clockFace = document.getElementById('clock-face');
            const countdownBanner = document.getElementById('countdown-banner');
            const cards = document.querySelectorAll('.card');

            if (elapsed >= 56 * 1000) {
                // 👑 56秒後：幾乎變成全白（極致白霜暴風雪世界）
                body.style.background = 'radial-gradient(circle at center, #d0e8ff 0%, #a0c8f0 100%)';
                dashboard.style.background = 'linear-gradient(135deg, rgba(220, 240, 255, 0.95) 0%, rgba(180, 215, 250, 0.98) 100%)';
                dashboard.style.borderColor = 'rgba(255, 255, 255, 0.95)';
                frostOverlay.style.opacity = '1';
                frostOverlay.style.boxShadow = 'inset 0 0 300px rgba(255, 255, 255, 0.95), inset 0 0 600px rgba(200, 235, 255, 0.9)';
                clockFace.style.background = 'radial-gradient(circle, rgba(210, 235, 255, 0.98) 0%, rgba(170, 205, 240, 0.99) 100%)';
                clockFace.style.borderColor = 'rgba(255, 255, 255, 0.95)';
                countdownBanner.style.background = 'rgba(210, 235, 255, 0.95)';
                cards.forEach(c => {
                    c.style.background = 'rgba(225, 242, 255, 0.95)';
                    c.style.borderColor = 'rgba(255, 255, 255, 0.8)';
                });
            } else if (elapsed >= 36 * 1000) {
                // 👑 36秒後：變得更白、冰霜加劇
                body.style.background = 'radial-gradient(circle at center, #254b70 0%, #0d2138 100%)';
                dashboard.style.background = 'linear-gradient(135deg, rgba(40, 85, 125, 0.85) 0%, rgba(10, 30, 55, 0.95) 100%)';
                dashboard.style.borderColor = 'rgba(200, 240, 255, 0.85)';
                frostOverlay.style.opacity = '0.9';
                frostOverlay.style.boxShadow = 'inset 0 0 250px rgba(150, 225, 255, 0.7), inset 0 0 500px rgba(255, 255, 255, 0.6)';
                clockFace.style.background = 'radial-gradient(circle, rgba(20, 50, 85, 0.96) 0%, rgba(5, 15, 30, 0.99) 100%)';
                cards.forEach(c => {
                    c.style.background = 'rgba(25, 55, 90, 0.92)';
                    c.style.borderColor = 'rgba(180, 230, 255, 0.7)';
                });
            }
        }

        // 每秒檢查一次極凍階段
        setInterval(checkExtremeFreezing, 1000);

        // 暴風雪特效
        const canvas = document.getElementById('snowflake-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const snowflakes = [];
        const maxSnowflakes = 180;

        for (let i = 0; i < maxSnowflakes; i++) {
            snowflakes.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 5 + 1.5,
                density: Math.random() * 20,
                speedY: Math.random() * 2.2 + 1.0,
                speedX: Math.random() * 1.2 - 0.6,
                opacity: Math.random() * 0.8 + 0.2
            });
        }

        function drawSnowflakes() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < snowflakes.length; i++) {
                let sf = snowflakes[i];
                ctx.fillStyle = `rgba(255, 255, 255, ${sf.opacity})`;
                ctx.beginPath();
                ctx.arc(sf.x, sf.y, sf.radius, 0, Math.PI * 2, true);
                ctx.fill();
            }
            updateSnowflakes();
        }

        let angle = 0;
        function updateSnowflakes() {
            angle += 0.015;
            for (let i = 0; i < snowflakes.length; i++) {
                let sf = snowflakes[i];
                sf.y += sf.speedY;
                sf.x += Math.sin(angle + sf.density) * 0.8 + sf.speedX;

                if (sf.y > canvas.height + 10) {
                    sf.y = -10;
                    sf.x = Math.random() * canvas.width;
                }
                if (sf.x > canvas.width + 10) {
                    sf.x = -10;
                } else if (sf.x < -10) {
                    sf.x = canvas.width + 10;
                }
            }
        }

        setInterval(drawSnowflakes, 20);

        // 時鐘與日期更新
        function updateClock() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();
            const milliseconds = now.getMilliseconds();

            const secondDeg = ((seconds + milliseconds / 1000) / 60) * 360;
            const minuteDeg = ((minutes + seconds / 60) / 60) * 360;
            const hourDeg = (((hours % 12) + minutes / 60) / 12) * 360;

            document.getElementById('second-hand').style.transform = `translateX(-50%) rotate(${secondDeg}deg)`;
            document.getElementById('minute-hand').style.transform = `translateX(-50%) rotate(${minuteDeg}deg)`;
            document.getElementById('hour-hand').style.transform = `translateX(-50%) rotate(${hourDeg}deg)`;

            const hStr = String(hours).padStart(2, '0');
            const mStr = String(minutes).padStart(2, '0');
            const sStr = String(seconds).padStart(2, '0');
            document.getElementById('digital-time').innerText = `${hStr}:${mStr}:${sStr}`;

            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            document.getElementById('date-display').innerText = `${year}.${month}.${day}`;

            const weekdays = ['星期日 Sunday', '星期一 Monday', '星期二 Tuesday', '星期三 Wednesday', '星期四 Thursday', '星期五 Friday', '星期六 Saturday'];
            document.getElementById('weekday-display').innerText = weekdays[now.getDay()];
        }

        setInterval(updateClock, 50);
        updateClock();

        // 真實天氣 API (Open-Meteo)
        async function fetchWeather() {
            try {
                const lat = 24.56;
                const lon = 120.82;
                const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code`);
                const data = await response.json();

                const temp = Math.round(data.current.temperature_2m);
                const humidity = data.current.relative_humidity_2m;
                const weatherCode = data.current.weather_code;

                function getWeatherDescription(code) {
                    if (code === 0) return "極地晴朗 · 寒風刺骨";
                    if (code >= 1 && code <= 3) return "晴時多雲 · 冰冷";
                    if (code >= 45 && code <= 48) return "冰霧壟罩 · 能見度低";
                    if (code >= 51 && code <= 67) return "凍雨/陣雪 · 注意保暖";
                    if (code >= 71 && code <= 77) return "暴雪紛飛 · 嚴寒";
                    if (code >= 95) return "冰雹雷雨交加";
                    return "極寒陰天 · 酷凍";
                }

                document.getElementById('weather-temp').innerText = `${temp}°C`;
                document.getElementById('weather-desc').innerText = getWeatherDescription(weatherCode);
                document.getElementById('weather-humidity').innerText = `濕度 ${humidity}%`;
                document.getElementById('location-title').innerText = "Weather (Miaoli)";
            } catch (error) {
                console.log("氣象資料載入失敗，維持預設顯示");
            }
        }

        fetchWeather();
        setInterval(fetchWeather, 30 * 60 * 1000);

        // 倒數計時
        function updateCountdown() {
            const targetDate = new Date('2026-12-24T18:00:00');
            const now = new Date();
            const diffTime = targetDate - now;
            let diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            if (diffDays < 0) {
                diffDays = 0;
            }
            
            const formattedDays = String(diffDays).padStart(2, '0');
            const spanElement = document.getElementById('countdown-days');
            if (spanElement) {
                spanElement.textContent = formattedDays;
            }
        }

        updateCountdown();
        setInterval(updateCountdown, 1000 * 60 * 60);
    </script>
</body>
</html>
