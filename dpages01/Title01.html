<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=2160, height=3840, initial-scale=1.0">
    <title>教室案內 - 數位看板</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 2160px;
            height: 3840px;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff;
        }

        /* 背景圖片層 */
        #shared-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 2160px;
            height: 3840px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -2;
            transition: background-image 1s ease-in-out; /* 背景切換時加入 1 秒漸變特效 */
        }

        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 2160px;
            height: 3840px;
            background: rgba(0, 0, 0, 0.45); /* 半透明遮罩，確保文字清晰 */
            z-index: -1;
        }

        /* 電子看板直向滿版置中容器 */
        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 2160px;
            height: 3840px;
            padding: 120px;
            text-align: center;
        }

        /* 專為 2160x3840 比例設計的大型毛玻璃卡片 */
        .content-card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 2px solid rgba(255, 255, 255, 0.18);
            padding: 100px 80px;
            border-radius: 50px;
            width: 100%;
            max-width: 1700px;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6);
        }

        /* === 字體變化 1：流動漸層大標題 === */
        .title-gradient {
            font-size: 360px;
            font-weight: 900;
            letter-spacing: 4px;
            margin-bottom: 40px;
            background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 5s linear infinite;
            line-height: 1.2;
        }

        @keyframes shine {
            to {
                background-position: 200% center;
            }
        }

        /* === 字體變化 2：柔和霓虹發光副標題 === */
        .subtitle-neon {
            font-size: 45px;
            font-weight: 400;
            letter-spacing: 6px;
            color: #f1f5f9;
            margin-bottom: 60px;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.6),
                         0 0 30px rgba(56, 189, 248, 0.3);
        }

        /* === 字體變化 3：精緻內文排版 === */
        .description {
            font-size: 150px;
            line-height: 1.8;
            color: #cbd5e1;
            font-weight: 300;
            letter-spacing: 2px;
            border-top: 2px solid rgba(255, 255, 255, 0.15);
            padding-top: 40px;
            margin-top: 40px;
        }

        .description:first-of-type {
            border-top: 2px solid rgba(255, 255, 255, 0.15);
        }
    </style>
</head>
<body>

    <div id="shared-bg"></div>
    <div class="bg-overlay"></div>

    <div class="container">
        <div class="content-card">
            <!-- 這裡隨時可以修改文字內容 -->
            
	    <br></br>
            <br></br>
	    <br></br>
            <h1 class="title-gradient">教室案內</h1>
	    <br></br>

            <h2 class="subtitle-neon"></h2>
            
            <div class="description">
                少年展力隊 → 4F / 7F
            </div>
            <div class="description">
                舞蹈班 → 5F
            </div>
            <div class="description">
                陶笛班 → 6F
            </div>
            <div class="description">
                釣竿 / 幼兒啟蒙 → 7F
            </div>
            <div class="description">
            </div>
            <br></br>
	    <br></br>

        </div>
        </div>
    </div>

    <script>
        // 在這裡放入你的多個 GIF 圖片網址（想放幾個都可以）
        const gifList = [
            'https://ddkleo.github.io/index/dpages01/GIF02.gif',
            'https://ddkleo.github.io/index/dpages01/GIF21.gif',
            'https://ddkleo.github.io/index/dpages01/GIF00.gif',
            'https://ddkleo.github.io/index/dpages01/GIF01.gif',
            'https://ddkleo.github.io/index/dpages01/GIF03.gif',
            'https://ddkleo.github.io/index/dpages01/GIF11.gif',
            'https://ddkleo.github.io/index/dpages01/GIF31.gif'
        ];

        function setRandomBackground() {
            const sharedBg = document.getElementById('shared-bg');
            if (gifList.length > 0) {
                // 隨機挑選其中一個 GIF
                const randomIndex = Math.floor(Math.random() * gifList.length);
                const selectedGif = gifList[randomIndex];
                sharedBg.style.backgroundImage = `url(${selectedGif})`;
            }
        }

        // 頁面載入時隨機套用一個背景
        setRandomBackground();

        // 【選填】如果你希望電子看板開著不動時，每隔一段時間（例如 10 分鐘）自動再隨機換另一個 GIF 背景，可以取消下面這行的註解：
        // setInterval(setRandomBackground, 600000); // 600000 毫秒 = 10 分鐘
    </script>

</body>
</html>
