<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>字體主題頁</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff;
        }

        /* 自動同步背景圖片層 */
        #shared-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-image: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            z-index: -2;
            transition: background-image 0.4s ease;
        }

        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: -1;
        }

        /* 手機直向滿版置中容器 */
        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
            text-align: center;
        }

        /* 專為手機比例設計的毛玻璃卡片 */
        .content-card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 40px 24px;
            border-radius: 24px;
            width: 100%;
            max-width: 380px; /* 精準符合手機寬度，不破版 */
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        /* === 字體變化 1：流動漸層大標題 === */
        .title-gradient {
            font-size: 8rem;
            font-weight: 900;
            letter-spacing: 1.5px;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 5s linear infinite;
            line-height: 1.2;
        }

        @keyframes shine {
            to {
                background-position: 200% center;
            }
        }

        /* === 字體變化 2：柔和霓虹發光副標題 === */
        .subtitle-neon {
            font-size: 1.1rem;
            font-weight: 400;
            letter-spacing: 3px;
            color: #f1f5f9;
            margin-bottom: 25px;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.6),
                         0 0 20px rgba(56, 189, 248, 0.3);
        }

        /* === 字體變化 3：精緻內文排版 === */
        .description {
            font-size: 2rem;
            line-height: 1.7;
            color: #cbd5e1;
            font-weight: 300;
            letter-spacing: 0.8px;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <div id="shared-bg"></div>
    <div class="bg-overlay"></div>

    <div class="container">
        <div class="content-card">
            <!-- 這裡隨時可以修改文字內容 -->
            <h1 class="title-gradient">教室案內</h1>
            <h2 class="subtitle-neon"></h2>
            <p class="description">
                少年展力隊 → 4F/7F
            </p>
	    <p class="description">
                舞蹈班 → 5F
            </p>
	    <p class="description">
                陶笛班 → 6F
            </p>
	    <p class="description">
                釣竿/幼兒啟蒙 → 7F
            </p>

            <br><br/>
	    <br><br/>
	    <br><br/>

        </div>
    </div>

    <script>
        function syncBackground() {
            const savedBg = localStorage.getItem('mobile_custom_bg');
            const sharedBg = document.getElementById('shared-bg');
            if (savedBg) {
                sharedBg.style.backgroundImage = `url(${savedBg})`;
            } else {
                sharedBg.style.backgroundImage = 'linear-gradient(135deg, #1e293b 0%, #0f172a 100%)';
            }
        }

        window.addEventListener('storage', function(e) {
            if (e.key === 'mobile_custom_bg') {
                syncBackground();
            }
        });

        syncBackground();
    </script>
</body>
</html>
