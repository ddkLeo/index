<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Christmas Tree & Gift Mountain (2160x1280 Landscape)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* 2160x1280 橫向螢幕鎖定 (強烈寒冷冰凍感色系) */
        body {
            width: 2160px;
            height: 1280px;
            overflow: hidden;
            background: linear-gradient(135deg, #020617 0%, #082f49 50%, #0f172a 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* 冬夜微涼與強烈冰凍霜感環境光暈 */
        .ambient-glow {
            position: absolute;
            width: 2160px;
            height: 1280px;
            background: 
                radial-gradient(circle at 30% 20%, rgba(56, 189, 248, 0.25) 0%, transparent 50%),
                radial-gradient(circle at 70% 80%, rgba(14, 165, 233, 0.15) 0%, transparent 60%),
                radial-gradient(circle at 50% 50%, rgba(125, 211, 252, 0.1) 0%, transparent 40%);
            z-index: 1;
            pointer-events: none;
        }

        /* 雪花與冰晶 Canvas */
        #snowCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 2160px;
            height: 1280px;
            z-index: 2;
            pointer-events: none;
        }

        /* 右上角隱藏質感浮水印：「苗栗家扶」 */
        .hidden-watermark {
            position: absolute;
            top: 100px;
            right: 80px;
            font-size: 150px;
            font-weight: 800;
            letter-spacing: 8px;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.25), rgba(253, 224, 71, 0.2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(56, 189, 248, 0.15);
            z-index: 5; /* 位於背景與雪花之間，營造隱藏於背後的感覺 */
            opacity: 0;
            transform: translateY(-20px);
            transition: opacity 2s ease, transform 2s ease;
            pointer-events: none;
        }

        /* 當禮物跑完後觸發顯示與動態呼吸效果 */
        .hidden-watermark.show {
            opacity: 1;
            transform: translateY(0);
            animation: watermarkBreath 4s ease-in-out infinite alternate;
        }

        @keyframes watermarkBreath {
            0% { transform: translateY(0) scale(1); filter: brightness(0.9); }
            100% { transform: translateY(-8px) scale(1.02); filter: brightness(1.3); text-shadow: 0 0 50px rgba(56, 189, 248, 0.3); }
        }

        /* 左側聖誕倒數計時面板 */
        .countdown-board {
            position: absolute;
            top: 100px;
            left: 120px;
            background: rgba(15, 23, 42, 0.75);
            border: 2px solid rgba(56, 189, 248, 0.4);
            backdrop-filter: blur(12px);
            padding: 35px 50px;
            border-radius: 24px;
            z-index: 20;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(56, 189, 248, 0.2);
            text-align: center;
            animation: boardFloat 3s ease-in-out infinite alternate;
        }

        @keyframes boardFloat {
            0% { transform: translateY(0); }
            100% { transform: translateY(-8px); }
        }

        .countdown-title {
            font-size: 70px;
            font-weight: 700;
            color: #38bdf8;
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }

        .countdown-timer {
            font-size: 100px;
            font-weight: 900;
            color: #fde047;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(253, 224, 71, 0.6);
        }

        .countdown-sub {
            font-size: 40px;
            color: #94a3b8;
            margin-top: 10px;
            letter-spacing: 1px;
        }

        /* 浪漫雪地地景 */
        .snow-ground {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 2160px;
            height: 220px;
            background: linear-gradient(to top, #e0f2fe 0%, #bae6fd 60%, rgba(186, 230, 253, 0.8) 80%, transparent 100%);
            border-radius: 50% 50% 0 0 / 40px 40px 0 0;
            z-index: 10;
            pointer-events: none;
            box-shadow: inset 0 15px 25px rgba(255, 255, 255, 0.8), 0 -10px 30px rgba(56, 189, 248, 0.3);
        }

        /* 聖誕樹主容器 */
        .tree-container {
            position: relative;
            width: 900px;
            height: 1250px;
            z-index: 11;
            display: flex;
            justify-content: center;
            align-items: center;
            transform: scale(0.85);
            transform-origin: center bottom;
            bottom: -30px;
            margin-left: 350px;
        }

        /* 樹頂大星星 */
        .tree-star {
            position: absolute;
            top: 20px;
            font-size: 90px;
            color: #fde047;
            text-shadow: 0 0 30px #facc15, 0 0 60px #eab308, 0 0 90px #ca8a04;
            animation: starDance 2s ease-in-out infinite alternate;
            z-index: 10;
        }

        @keyframes starDance {
            0% { transform: scale(0.9) rotate(-10deg); filter: brightness(0.9); }
            100% { transform: scale(1.15) rotate(10deg); filter: brightness(1.4); }
        }

        /* 聖誕樹層疊區塊 */
        .tree-layer {
            position: absolute;
            width: 0;
            height: 0;
            border-left: solid transparent;
            border-right: solid transparent;
            border-bottom: solid;
            filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.7));
        }

        .layer-1 {
            top: 110px;
            border-left-width: 140px;
            border-right-width: 140px;
            border-bottom-width: 230px;
            border-bottom-color: #065f46;
            z-index: 5;
        }

        .layer-2 {
            top: 290px;
            border-left-width: 240px;
            border-right-width: 240px;
            border-bottom-width: 310px;
            border-bottom-color: #047857;
            z-index: 4;
        }

        .layer-3 {
            top: 530px;
            border-left-width: 350px;
            border-right-width: 350px;
            border-bottom-width: 390px;
            border-bottom-color: #064e3b;
            z-index: 3;
        }

        /* 樹幹 */
        .tree-trunk {
            position: absolute;
            bottom: 40px;
            width: 100px;
            height: 360px;
            background: linear-gradient(90deg, #271c18, #452a1d, #271c18);
            border-radius: 8px;
            z-index: 1;
            box-shadow: 0 10px 20px rgba(0,0,0,0.8);
        }

        /* 樹上的裝飾物件通用樣式 */
        .ornament-item {
            position: absolute;
            z-index: 8;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: itemSwing 3s ease-in-out infinite alternate;
        }

        @keyframes itemSwing {
            0% { transform: rotate(-8deg) scale(0.95); }
            100% { transform: rotate(8deg) scale(1.05); }
        }

        /* 禮物盒樣式 */
        .gift-box {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            border-radius: 6px;
            position: relative;
            box-shadow: 0 5px 12px rgba(0,0,0,0.4);
        }
        .gift-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 18px;
            width: 9px;
            height: 45px;
            background: #fde047;
        }
        .gift-box::after {
            content: '';
            position: absolute;
            top: 18px;
            left: 0;
            width: 45px;
            height: 9px;
            background: #fde047;
        }

        /* 聖誕襪樣式 */
        .sock {
            width: 35px;
            height: 48px;
            background: #dc2626;
            border-radius: 0 0 15px 15px;
            position: relative;
            box-shadow: 0 5px 12px rgba(0,0,0,0.4);
        }
        .sock::before {
            content: '';
            position: absolute;
            top: 0;
            left: -3px;
            width: 41px;
            height: 14px;
            background: #f8fafc;
            border-radius: 6px;
        }

        /* 閃爍彩色燈泡 */
        .bling-light {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            z-index: 7;
            animation: lightBlink 1.5s ease-in-out infinite alternate;
        }

        @keyframes lightBlink {
            0% { opacity: 0.3; transform: scale(0.8); filter: brightness(0.6); }
            100% { opacity: 1; transform: scale(1.25); filter: brightness(1.8); box-shadow: 0 0 15px currentColor; }
        }

        /* 樹上 Merry Christmas 掛牌 */
        .xmas-badge {
            position: absolute;
            top: 650px;
            left: 50%;
            transform: translateX(-50%) rotate(-4deg);
            background: linear-gradient(135deg, #b91c1c, #991b1b);
            border: 3px solid #fde047;
            padding: 10px 25px;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6), 0 0 20px rgba(239, 68, 68, 0.5);
            z-index: 9;
            animation: badgeFloat 2.5s ease-in-out infinite alternate;
        }

        @keyframes badgeFloat {
            0% { transform: translateX(-50%) translateY(0) rotate(-4deg); }
            100% { transform: translateX(-50%) translateY(-6px) rotate(4deg); }
        }

        .xmas-badge span {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 3px;
            color: #fde047;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            text-transform: uppercase;
        }

        /* 禮物掉落與堆疊容器 */
        .gift-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 2160px;
            height: 500px; 
            pointer-events: none;
            z-index: 12;
        }

        /* 單個禮物樣式與掉落動畫 */
        .gift-item {
            position: absolute;
            font-size: 240px; 
            bottom: -300px;    
            opacity: 0;
            filter: drop-shadow(0 15px 20px rgba(0, 0, 0, 0.6));
            transition: bottom 0.8s cubic-bezier(0.25, 1, 0.5, 1), 
                        opacity 0.4s ease, 
                        transform 0.4s ease;
        }
    </style>
</head>
<body>

    <!-- 背景霧氣與強烈寒冷極光暈 -->
    <div class="ambient-glow"></div>

    <!-- 降雪與冰晶 Canvas -->
    <canvas id="snowCanvas"></canvas>

    <!-- 右上角隱藏質感浮水印：「苗栗家扶」 -->
    <div id="watermark" class="hidden-watermark">苗栗家扶</div>

    <!-- 左側聖誕倒數計時面板 -->
    <div class="countdown-board">
        <div class="countdown-title">🎄 平安夜倒數 🎄</div>
        <div id="countdownTimer" class="countdown-timer">00 天 00 小時</div>
        <div class="countdown-sub">Merry Christmas & Happy New Year</div>
    </div>

    <!-- 浪漫雪地地景 -->
    <div class="snow-ground"></div>

    <!-- 聖誕樹本體 -->
    <div class="tree-container">
        <!-- 樹頂星星 -->
        <div class="tree-star">★</div>

        <!-- 樹的層次 -->
        <div class="tree-layer layer-1"></div>
        <div class="tree-layer layer-2"></div>
        <div class="tree-layer layer-3"></div>
        
        <div class="tree-trunk"></div>

        <!-- Merry Christmas 裝飾掛牌 -->
        <div class="xmas-badge">
            <span>Merry Christmas</span>
        </div>

        <!-- 動態生成的樹上掛飾與燈泡容器 -->
        <div id="decorationsContainer"></div>
    </div>

    <!-- 禮物掉落與堆疊容器 -->
    <div id="giftContainer" class="gift-container"></div>

    <script>
        // 1. 聖誕節倒數計時邏輯
        function updateCountdown() {
            const now = new Date();
            let year = now.getFullYear();
            let christmas = new Date(year, 11, 24, 18, 0, 0); // 12月24日

            if (now.getTime() > christmas.getTime()) {
                christmas = new Date(year + 1, 11, 24, 18, 0, 0);
            }

            const diff = christmas.getTime() - now.getTime();
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));

            document.getElementById('countdownTimer').innerText = 
                `${days} 天 ${String(hours).padStart(2, '0')} 小時`;
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        // 2. 加強版寒冷飄雪與冰晶特效
        const canvas = document.getElementById('snowCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = 2160;
            canvas.height = 1280;
        }
        resizeCanvas();

        const snowflakes = [];
        const numFlakes = 160;

        for (let i = 0; i < numFlakes; i++) {
            snowflakes.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 4 + 1.5,
                speedY: Math.random() * 2 + 0.8,
                speedX: (Math.random() - 0.5) * 1.5,
                opacity: Math.random() * 0.8 + 0.2
            });
        }

        function drawSnow() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            snowflakes.forEach(flake => {
                ctx.beginPath();
                ctx.arc(flake.x, flake.y, flake.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(186, 230, 253, ${flake.opacity})`;
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#38bdf8';
                ctx.fill();

                flake.y += flake.speedY;
                flake.x += flake.speedX;

                if (flake.y > canvas.height) {
                    flake.y = -20;
                    flake.x = Math.random() * canvas.width;
                }
                if (flake.x > canvas.width) {
                    flake.x = 0;
                } else if (flake.x < 0) {
                    flake.x = canvas.width;
                }
            });

            requestAnimationFrame(drawSnow);
        }
        drawSnow();

        // 3. 自動在樹上隨機分佈裝飾
        const container = document.getElementById('decorationsContainer');
        const lightColors = ['#38bdf8', '#7dd3fc', '#bae6fd', '#fde047', '#f87171', '#ffffff', '#c084fc', '#4ade80'];

        const specialItems = ['gift', 'sock', 'star'];
        for (let i = 0; i < 25; i++) {
            const item = document.createElement('div');
            item.classList.add('ornament-item');

            const topPos = Math.random() * 900 + 100;
            const widthAtHeight = ((topPos - 50) / 1000) * 700;
            const leftPos = (900 / 2) + (Math.random() - 0.5) * (widthAtHeight * 0.8);

            item.style.top = `${topPos}px`;
            item.style.left = `${leftPos}px`;
            item.style.animationDelay = `${Math.random() * 2}s`;

            const type = specialItems[Math.floor(Math.random() * specialItems.length)];
            if (type === 'gift') {
                const box = document.createElement('div');
                box.classList.add('gift-box');
                item.appendChild(box);
            } else if (type === 'sock') {
                const s = document.createElement('div');
                s.classList.add('sock');
                item.appendChild(s);
            } else {
                const st = document.createElement('div');
                st.innerHTML = '★';
                st.style.fontSize = '30px';
                st.style.color = '#fde047';
                st.style.textShadow = '0 0 10px #facc15';
                item.appendChild(st);
            }

            container.appendChild(item);
        }

        // 產生大量閃爍燈泡 (80 顆)
        for (let i = 0; i < 80; i++) {
            const light = document.createElement('div');
            light.classList.add('ornament-item', 'bling-light');

            const topPos = Math.random() * 1000 + 80;
            const widthAtHeight = ((topPos - 50) / 1000) * 800;
            const leftPos = (900 / 2) + (Math.random() - 0.5) * widthAtHeight;

            light.style.top = `${topPos}px`;
            light.style.left = `${leftPos}px`;

            const color = lightColors[Math.floor(Math.random() * lightColors.length)];
            light.style.backgroundColor = color;
            light.style.color = color;
            light.style.animationDelay = `${Math.random() * 2}s`;
            light.style.animationDuration = `${Math.random() * 1 + 1}s`;

            container.appendChild(light);
        }

        // 4. 禮物掉落與堆疊邏輯 (75 個禮物)
        const giftContainer = document.getElementById('giftContainer');
        const maxGifts = 75; 
        let currentGifts = 0;

        function spawnGift() {
            if (currentGifts >= maxGifts) {
                clearInterval(giftTimer);
                // 當所有禮物掉落完畢後，延遲 1 秒讓右上方浮水印緩緩現身
                setTimeout(() => {
                    document.getElementById('watermark').classList.add('show');
                }, 1000);
                return;
            }

            const gift = document.createElement('div');
            gift.className = 'gift-item';
            gift.innerText = '🎁';

            const randomX = Math.random() * (2160 - 250);
            const randomBottom = Math.random() * 150; 
            const randomRotate = Math.random() * 40 - 20; 
            const randomScale = 0.7 + Math.random() * 0.5;

            gift.style.left = `${randomX}px`;
            giftContainer.appendChild(gift);

            setTimeout(() => {
                gift.style.opacity = '1';
                gift.style.bottom = `${randomBottom}px`;
                gift.style.transform = `rotate(${randomRotate}deg) scale(${randomScale})`;
            }, 50);

            currentGifts++;
        }

        const giftTimer = setInterval(spawnGift, 120);
    </script>
</body>
</html>
