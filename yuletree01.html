<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Christmas Tree & Gift Mountain (Full Effects)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 2160px;
            height: 1280px;
            overflow: hidden;
            background: #020617;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .ambient-glow {
            position: absolute;
            width: 2160px;
            height: 1280px;
            background: 
                radial-gradient(circle at 30% 20%, rgba(56, 189, 248, 0.25) 0%, transparent 50%),
                radial-gradient(circle at 70% 80%, rgba(14, 165, 233, 0.15) 0%, transparent 60%);
            z-index: 1;
            pointer-events: none;
            transition: opacity 2s ease;
        }

        #snowCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 2160px;
            height: 1280px;
            z-index: 2;
            pointer-events: none;
        }

        #meteorCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 2160px;
            height: 1280px;
            z-index: 3;
            pointer-events: none;
        }

        .hidden-watermark {
            position: absolute;
            top: 130px;
            right: 70px;
            font-size: 140px;
            font-weight: 900;
            letter-spacing: 12px;
            background: linear-gradient(#07ac6f, #0af59e 50%, #ffffff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.6), 0 0 35px rgba(251, 191, 36, 0.6);
            z-index: 5;
            opacity: 0;
            transform: translateY(-20px);
            transition: opacity 2s ease, transform 2s ease;
            pointer-events: none;
        }

        .hidden-watermark.show {
            opacity: 1;
            transform: translateY(0);
            animation: watermarkBreath 4s ease-in-out infinite alternate;
        }

        @keyframes watermarkBreath {
            0% { transform: translateY(0) scale(1); filter: brightness(1); }
            100% { transform: translateY(-5px) scale(1.01); filter: brightness(1.15); }
        }

        .countdown-board {
            position: absolute;
            top: 100px;
            left: 120px;
            background: rgba(15, 23, 42, 0.75);
            border: 2px solid rgba(56, 189, 248, 0.4);
            backdrop-filter: blur(12px);
            padding: 35px 50px;
            border-radius: 24px;
            z-index: 20;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        .countdown-title {
            font-size: 70px;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .countdown-timer {
            font-size: 100px;
            font-weight: 900;
            color: #fde047;
        }

        .countdown-sub {
            font-size: 40px;
            color: #94a3b8;
            margin-top: 10px;
        }

        .snow-ground {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 2160px;
            height: 220px;
            background: linear-gradient(to top, #e0f2fe 0%, #bae6fd 60%, transparent 100%);
            border-radius: 50% 50% 0 0 / 40px 40px 0 0;
            z-index: 10;
            pointer-events: none;
        }

        .tree-container {
            position: relative;
            width: 900px;
            height: 1250px;
            z-index: 11;
            display: flex;
            justify-content: center;
            align-items: center;
            transform: scale(0.85);
            transform-origin: center bottom;
            bottom: -30px;
            margin-left: 350px;
        }

        /* 樹頂星星會動 */
        .tree-star {
            position: absolute;
            top: 20px;
            font-size: 90px;
            color: #fde047;
            text-shadow: 0 0 30px #facc15, 0 0 60px #eab308;
            animation: starDance 2s ease-in-out infinite alternate;
            z-index: 10;
        }

        @keyframes starDance {
            0% { transform: scale(0.9) rotate(-10deg); filter: brightness(0.9); }
            100% { transform: scale(1.15) rotate(10deg); filter: brightness(1.4); }
        }

        .tree-layer {
            position: absolute;
            width: 0;
            height: 0;
            border-left: solid transparent;
            border-right: solid transparent;
            border-bottom: solid;
            filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.7));
        }

        .layer-1 { top: 110px; border-left-width: 140px; border-right-width: 140px; border-bottom-width: 230px; border-bottom-color: #065f46; z-index: 5; }
        .layer-2 { top: 290px; border-left-width: 240px; border-right-width: 240px; border-bottom-width: 310px; border-bottom-color: #047857; z-index: 4; }
        .layer-3 { top: 530px; border-left-width: 350px; border-right-width: 350px; border-bottom-width: 390px; border-bottom-color: #064e3b; z-index: 3; }

        .tree-trunk {
            position: absolute;
            bottom: 40px;
            width: 100px;
            height: 360px;
            background: linear-gradient(90deg, #271c18, #452a1d, #271c18);
            border-radius: 8px;
            z-index: 1;
        }

        /* 樹上裝飾物件會搖擺 */
        .ornament-item {
            position: absolute;
            z-index: 8;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: itemSwing 3s ease-in-out infinite alternate;
        }

        @keyframes itemSwing {
            0% { transform: rotate(-8deg) scale(0.95); }
            100% { transform: rotate(8deg) scale(1.05); }
        }

        .gift-box {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            border-radius: 6px;
            position: relative;
            box-shadow: 0 5px 12px rgba(0,0,0,0.4);
        }
        .gift-box::before {
            content: ''; position: absolute; top: 0; left: 40%; width: 20%; height: 100%; background: #fde047;
        }
        .gift-box::after {
            content: ''; position: absolute; top: 40%; left: 0; width: 100%; height: 20%; background: #fde047;
        }

        .sock {
            width: 100%; height: 100%; background: #dc2626; border-radius: 0 0 45% 45%; position: relative;
        }
        .sock::before {
            content: ''; position: absolute; top: 0; left: -10%; width: 120%; height: 30%; background: #f8fafc; border-radius: 6px;
        }

        /* 燈泡會閃爍發光 */
        .bling-light {
            border-radius: 50%;
            z-index: 7;
            animation: lightBlink 1.5s ease-in-out infinite alternate;
        }

        @keyframes lightBlink {
            0% { opacity: 0.3; transform: scale(0.8); filter: brightness(0.6); }
            100% { opacity: 1; transform: scale(1.25); filter: brightness(1.8); box-shadow: 0 0 15px currentColor; }
        }

        .xmas-badge {
            position: absolute;
            top: 650px;
            left: 50%;
            transform: translateX(-50%) rotate(-4deg);
            background: linear-gradient(135deg, #b91c1c, #991b1b);
            border: 3px solid #fde047;
            padding: 10px 25px;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
            z-index: 9;
        }

        .xmas-badge span {
            font-size: 26px; font-weight: 800; letter-spacing: 3px; color: #fde047; text-transform: uppercase;
        }

        .gift-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 2160px;
            height: 220px;
            pointer-events: none;
            z-index: 13;
        }

        .gift-item {
            position: absolute;
            font-size: 180px;
            bottom: -300px;
            opacity: 0;
            transition: bottom 0.8s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s ease;
        }
    </style>
</head>
<body>

    <div id="ambientGlow" class="ambient-glow"></div>
    <canvas id="snowCanvas"></canvas>
    <canvas id="meteorCanvas"></canvas>

    <div id="watermark" class="hidden-watermark">苗栗家扶</div>

    <div class="countdown-board">
        <div class="countdown-title">🎄 平安夜倒數 🎄</div>
        <div id="countdownTimer" class="countdown-timer">00 天 00 小時</div>
        <div class="countdown-sub">Merry Christmas & Happy New Year</div>
    </div>

    <div class="snow-ground"></div>

    <div class="tree-container">
        <div class="tree-star">★</div>
        <div class="tree-layer layer-1"></div>
        <div class="tree-layer layer-2"></div>
        <div class="tree-layer layer-3"></div>
        <div class="tree-trunk"></div>
        <div class="xmas-badge">
            <span>Merry Christmas</span>
        </div>
        <div id="decorationsContainer"></div>
    </div>

    <div id="giftContainer" class="gift-container"></div>

    <script>
        const startTime = Date.now();

        // 1. 背景平滑漸進式過渡
        function updateBackgroundTheme() {
            const elapsedSeconds = (Date.now() - startTime) / 1000;
            const body = document.body;
            const glow = document.getElementById('ambientGlow');

            let r, g, b, opacityGlow;
            if (elapsedSeconds <= 10) {
                r = 2; g = 6; b = 23; opacityGlow = 0.3;
            } else if (elapsedSeconds <= 30) {
                const p = (elapsedSeconds - 10) / 20;
                r = Math.round(2 + (8 - 2) * p);
                g = Math.round(6 + (47 - 6) * p);
                b = Math.round(23 + (73 - 23) * p);
                opacityGlow = 0.3 + 0.3 * p;
            } else if (elapsedSeconds <= 80) {
                const p = (elapsedSeconds - 30) / 50;
                r = Math.round(8 + (86 - 8) * p);
                g = Math.round(47 + (130 - 47) * p);
                b = Math.round(73 + (153 - 73) * p);
                opacityGlow = 0.6 + 0.25 * p;
            } else {
                r = 86; g = 130; b = 153; opacityGlow = 0.85;
            }

            body.style.background = `rgb(${r}, ${g}, ${b})`;
            glow.style.opacity = opacityGlow;

            if (elapsedSeconds >= 20) {
                document.getElementById('watermark').classList.add('show');
            }
        }
        setInterval(updateBackgroundTheme, 200);

        // 2. 倒數計時
        function updateCountdown() {
            const now = new Date();
            let christmas = new Date(now.getFullYear(), 11, 24, 18, 0, 0);
            if (now.getTime() > christmas.getTime()) {
                christmas = new Date(now.getFullYear() + 1, 11, 24, 18, 0, 0);
            }
            const diff = christmas.getTime() - now.getTime();
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            document.getElementById('countdownTimer').innerText = `${days} 天 ${String(hours).padStart(2, '0')} 小時`;
        }
        setInterval(updateCountdown, 1000);
        updateCountdown();

        // 3. 飄雪 Canvas
        const canvas = document.getElementById('snowCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 2160; canvas.height = 1280;

        const snowflakes = [];
        for (let i = 0; i < 140; i++) {
            snowflakes.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 3.5 + 1.5,
                speedY: Math.random() * 1.8 + 0.8,
                speedX: (Math.random() - 0.5) * 1.2,
                opacity: Math.random() * 0.7 + 0.3
            });
        }

        function drawSnow() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            snowflakes.forEach(flake => {
                ctx.beginPath();
                ctx.arc(flake.x, flake.y, flake.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(186, 230, 253, ${flake.opacity})`;
                ctx.fill();

                flake.y += flake.speedY;
                flake.x += flake.speedX;

                if (flake.y > canvas.height) { flake.y = -10; flake.x = Math.random() * canvas.width; }
                if (flake.x > canvas.width) flake.x = 0;
                else if (flake.x < 0) flake.x = canvas.width;
            });
            requestAnimationFrame(drawSnow);
        }
        drawSnow();

        // 4. 17秒時流星劃過特效
        const meteorCanvas = document.getElementById('meteorCanvas');
        const mCtx = meteorCanvas.getContext('2d');
        meteorCanvas.width = 2160; meteorCanvas.height = 1280;

        let meteorTriggered = false;
        let meteor = { x: 2000, y: 100, length: 350, speed: 25, opacity: 1, active: false };

        function updateMeteor() {
            const elapsedSeconds = (Date.now() - startTime) / 1000;
            mCtx.clearRect(0, 0, meteorCanvas.width, meteorCanvas.height);

            if (elapsedSeconds >= 17 && !meteorTriggered) {
                meteor.active = true;
                meteorTriggered = true;
            }

            if (meteor.active) {
                mCtx.save();
                mCtx.strokeStyle = `rgba(224, 242, 254, ${meteor.opacity})`;
                mCtx.lineWidth = 4;
                mCtx.shadowBlur = 20;
                mCtx.shadowColor = '#38bdf8';
                mCtx.beginPath();
                mCtx.moveTo(meteor.x, meteor.y);
                mCtx.lineTo(meteor.x - meteor.length, meteor.y + meteor.length * 0.5);
                mCtx.stroke();
                mCtx.restore();

                meteor.x -= meteor.speed;
                meteor.y += meteor.speed * 0.5;
                meteor.opacity -= 0.015;
                if (meteor.opacity <= 0) meteor.active = false;
            }
            requestAnimationFrame(updateMeteor);
        }
        updateMeteor();

        // 5. 樹上裝飾防重疊演算法（確保不雜亂重疊）
        const container = document.getElementById('decorationsContainer');
        const lightColors = ['#38bdf8', '#7dd3fc', '#bae6fd', '#fde047', '#f87171', '#ffffff', '#c084fc', '#4ade80'];
        const placedDecorations = [];

        function isValidPosition(x, y, minDistance) {
            for (let pos of placedDecorations) {
                if (Math.sqrt(Math.pow(pos.x - x, 2) + Math.pow(pos.y - y, 2)) < minDistance) return false;
            }
            return true;
        }

        // 生成禮物與襪子掛飾
        const specialTypes = ['gift', 'sock', 'star'];
        let attempts = 0;
        while (placedDecorations.length < 28 && attempts < 800) {
            attempts++;
            const topPos = Math.random() * 800 + 140;
            const widthAtHeight = ((topPos - 50) / 1000) * 650;
            const leftPos = (900 / 2) + (Math.random() - 0.5) * (widthAtHeight * 0.8);

            if (!isValidPosition(leftPos, topPos, 60)) continue;
            placedDecorations.push({ x: leftPos, y: topPos });

            const item = document.createElement('div');
            item.classList.add('ornament-item');
            item.style.top = `${topPos}px`;
            item.style.left = `${leftPos}px`;
            item.style.animationDelay = `${Math.random() * 2}s`;

            const type = specialTypes[Math.floor(Math.random() * specialTypes.length)];
            const size = Math.floor(Math.random() * 18) + 38;

            if (type === 'gift') {
                const box = document.createElement('div'); box.classList.add('gift-box');
                item.style.width = `${size}px`; item.style.height = `${size}px`; item.appendChild(box);
            } else if (type === 'sock') {
                const s = document.createElement('div'); s.classList.add('sock');
                item.style.width = `${size * 0.8}px`; item.style.height = `${size * 1.1}px`; item.appendChild(s);
            } else {
                const st = document.createElement('div'); st.innerHTML = '★';
                st.style.fontSize = `${size * 0.9}px`; st.style.color = '#fde047'; st.style.textShadow = '0 0 10px #facc15';
                item.appendChild(st);
            }
            container.appendChild(item);
        }

        // 生成閃爍燈泡 (70 顆)
        let lightAttempts = 0, lightsCount = 0;
        while (lightsCount < 70 && lightAttempts < 1500) {
            lightAttempts++;
            const topPos = Math.random() * 900 + 100;
            const widthAtHeight = ((topPos - 50) / 1000) * 750;
            const leftPos = (900 / 2) + (Math.random() - 0.5) * widthAtHeight;

            if (!isValidPosition(leftPos, topPos, 32)) continue;
            placedDecorations.push({ x: leftPos, y: topPos });

            const light = document.createElement('div');
            light.classList.add('ornament-item', 'bling-light');
            const size = Math.floor(Math.random() * 8) + 12;
            light.style.width = `${size}px`; light.style.height = `${size}px`;
            light.style.top = `${topPos}px`; light.style.left = `${leftPos}px`;

            const color = lightColors[Math.floor(Math.random() * lightColors.length)];
            light.style.backgroundColor = color;
            light.style.color = color;
            light.style.animationDelay = `${Math.random() * 2}s`;
            light.style.animationDuration = `${Math.random() * 1 + 1}s`;

            container.appendChild(light);
            lightsCount++;
        }

        // 6. 底部動態掉落禮物
        const giftContainer = document.getElementById('giftContainer');
        let currentGifts = 0;
        const maxGifts = 80;

        function spawnGift() {
            if (currentGifts >= maxGifts) return;
            const gift = document.createElement('div');
            gift.className = 'gift-item';
            gift.innerText = '🎁';

            gift.style.left = `${Math.random() * 1980 + 90}px`;
            giftContainer.appendChild(gift);

            setTimeout(() => {
                gift.style.opacity = '1';
                gift.style.bottom = `${Math.random() * 130}px`;
                gift.style.transform = `rotate(${Math.random() * 45 - 22.5}deg) scale(${0.65 + Math.random() * 0.5})`;
            }, 50);

            currentGifts++;
        }

        // 24 秒後開始掉落禮物
        const delayCheck = setInterval(() => {
            if ((Date.now() - startTime) / 1000 >= 24) {
                clearInterval(delayCheck);
                setInterval(spawnGift, 180);
            }
        }, 500);

        // 38 秒自動跳轉
        setTimeout(function() {
            window.location.href = 'https://ddkleo.github.io/index/dpages03/walkbaby01/walkbaby00';
        }, 38000);
    </script>
</body>
</html>
